<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>内网共享打印</title>
  <style>
    :root { --brand:#2563eb; --bg:#f4f6fb; --card:#fff; --ok:#16a34a; --err:#dc2626; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      background:var(--bg); color:#1f2937; padding:16px;
    }
    .wrap { max-width:520px; margin:0 auto; }
    h1 { font-size:20px; margin:8px 0 4px; display:flex; align-items:center; gap:8px; }
    .sub { color:#6b7280; font-size:13px; margin-bottom:16px; }
    .card { background:var(--card); border-radius:16px; padding:18px; margin-bottom:16px;
      box-shadow:0 1px 3px rgba(0,0,0,.08); }
    label { font-size:14px; font-weight:600; display:block; margin-bottom:8px; }
    .drop {
      border:2px dashed #c7d2fe; border-radius:14px; padding:28px 16px; text-align:center;
      color:#6b7280; cursor:pointer; transition:.15s; background:#fafbff;
    }
    .drop.drag { border-color:var(--brand); background:#eef2ff; color:var(--brand); }
    .drop b { color:var(--brand); }
    .file-name { margin-top:10px; font-size:14px; color:#111827; word-break:break-all; }
    select, input[type=number] {
      width:100%; padding:11px 12px; border:1px solid #d1d5db; border-radius:10px;
      font-size:15px; background:#fff; appearance:none;
    }
    .row { display:flex; gap:12px; }
    .row > div { flex:1; }
    .opts { margin-top:14px; }
    .opts > div { margin-bottom:14px; }
    .chk { display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px; }
    .chk input { width:18px; height:18px; }
    button {
      width:100%; padding:14px; border:0; border-radius:12px; background:var(--brand);
      color:#fff; font-size:16px; font-weight:700; cursor:pointer; margin-top:4px;
    }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .status { margin-top:14px; padding:12px 14px; border-radius:10px; font-size:14px;
      display:none; white-space:pre-wrap; }
    .status.ok { display:block; background:#ecfdf5; color:var(--ok); }
    .status.err { display:block; background:#fef2f2; color:var(--err); }
    .status.info { display:block; background:#eff6ff; color:var(--brand); }
    .tips { font-size:12px; color:#9ca3af; margin-top:6px; }
    .empty { color:var(--err); font-size:14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🖨️ 内网共享打印</h1>
    <div class="sub">无需安装驱动 · 支持安卓 / iOS / Mac / Windows · 本机 IP {{ host_ip }}</div>

    <form id="form" class="card">
      <label>① 选择文件</label>
      <div class="drop" id="drop">
        点击选择 或 拖拽文件到此<br>
        <b>选择要打印的文件</b>
        <div class="file-name" id="fileName"></div>
      </div>
      <input type="file" id="file" name="file" hidden>
      <div class="tips">支持: {{ allowed | join(' / ') }}（单文件 ≤ 100MB）</div>

      <div class="opts">
        <div>
          <label>② 选择打印机</label>
          {% if printers %}
          <select name="printer" id="printer">
            {% for p in printers %}
            <option value="{{ p.name }}" {% if p.default %}selected{% endif %}>
              {{ p.name }}{% if p.default %}（默认）{% endif %}
            </option>
            {% endfor %}
          </select>
          {% else %}
          <div class="empty">⚠️ 未检测到打印机。请确认本程序运行在已连接打印机的 Windows 上, 并已安装 pywin32。</div>
          {% endif %}
        </div>

        <div class="row">
          <div>
            <label>份数</label>
            <input type="number" name="copies" id="copies" value="1" min="1" max="99">
          </div>
          <div>
            <label>颜色</label>
            <select name="color" id="color">
              <option value="auto">自动</option>
              <option value="color">彩色</option>
              <option value="mono">黑白</option>
            </select>
          </div>
        </div>

        <div>
          <label class="chk"><input type="checkbox" name="duplex" id="duplex"> 双面打印</label>
        </div>
      </div>

      <button type="submit" id="btn" {% if not printers %}disabled{% endif %}>开始打印</button>
      <div class="status" id="status"></div>
    </form>
  </div>

  <script>
    const fileInput = document.getElementById('file');
    const drop = document.getElementById('drop');
    const fileName = document.getElementById('fileName');
    const form = document.getElementById('form');
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');

    drop.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => showName());
    function showName() {
      fileName.textContent = fileInput.files.length ? '已选择: ' + fileInput.files[0].name : '';
    }
    ['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => {
      ev.preventDefault(); drop.classList.add('drag');
    }));
    ['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => {
      ev.preventDefault(); drop.classList.remove('drag');
    }));
    drop.addEventListener('drop', ev => {
      if (ev.dataTransfer.files.length) { fileInput.files = ev.dataTransfer.files; showName(); }
    });

    function setStatus(cls, msg) { status.className = 'status ' + cls; status.textContent = msg; }

    form.addEventListener('submit', async ev => {
      ev.preventDefault();
      if (!fileInput.files.length) { setStatus('err', '请先选择文件'); return; }
      const data = new FormData(form);
      data.set('duplex', document.getElementById('duplex').checked ? 'true' : 'false');
      btn.disabled = true;
      setStatus('info', '正在上传并打印, 请稍候…');
      try {
        const r = await fetch('/api/print', { method: 'POST', body: data });
        const j = await r.json();
        if (j.ok) { setStatus('ok', '✅ ' + (j.message || '打印任务已发送')); }
        else { setStatus('err', '❌ ' + (j.error || '打印失败')); }
      } catch (e) {
        setStatus('err', '❌ 网络错误: ' + e.message);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
